    - "ノート"
    - "録音"
    - "音声会話"
    - "トピック"
    - "Appツール"
  app_store_badge_alt: App Store でダウンロード
  play_store_badge_alt: Google Play で手に入れよう
  testflight_cta: TestFlight を試す
  hero_download_note: "TestFlight のサブスクリプションはベータ期間中無料です。AI サービスの利用分は別途扱われ、設定したアカウントに依存します。"
  screens:
    eyebrow: 製品画面
    title: "ノートからトピックへつながる画面。"
    description: "集めた資料が役立つ成果になる流れを確認できます。"
    cards:
      - title: 受信トレイ
        description: 今日のノート、AI 結果カード、タグ、そして 4 つの主要な取り込みアクションを表示します。
        alt: AnyNotes 受信トレイのスクリーンショット
        image: /assets/screenshot/ja/inbox-home.png
      - title: トピックホーム
        description: トピックホームで、現在の見立て、最近の変化、次の一手をまとめて確認できます。
        alt: AnyNotes トピックホームのスクリーンショット
        image: /assets/screenshot/ja/topic-home.png
      - title: "トピックの成果"
        description: "トピックをブリーフ、タスクリスト、文書にまとめます。"
        alt: "AnyNotes トピックの成果画面"
        image: /assets/screenshot/ja/topic-outcomes.png
  features_intro:
    eyebrow: 実際の記録習慣に合う設計
    title: "小さな思いつきから、使える成果へ。"
    description: "素材を集め、AI と内容を整理し、同じノート、トピック、会話の中で作業を続けられます。"
  features:
    - title: "取り込んで整理"
      description: "テキストや録音を残し、写真、PDF、テキストファイル、共有したWebページを取り込めます。AI がタイトル、要約、結果カード、次のステップを整理します。"
      fontawesome_icon_name: inbox
    - title: "話しながら考えを整理"
      description: "iOS の録音中に要点、未解決の問い、次のステップを整理。提案された操作は確認後に実行します。リアルタイム整理には API キーが必要です。"
      fontawesome_icon_name: microphone
    - title: "音声で会話を続ける"
      description: "新しい会話や既存のチャットから音声会話へ。文脈を引き継ぎ、字幕を読み、チャットで利用できるツールを AI に依頼できます。"
      fontawesome_icon_name: comments
    - title: "トピックを知識に育てる"
      description: "関連ノートをまとめ、方向性を決め、出典ノート付きの Topic Wiki を作成。ブリーフ、タスクリスト、文書をトピックの成果として保存できます。"
      fontawesome_icon_name: project-diagram
    - title: "端末の情報で次を計画"
      description: "iOS で予定やリマインダーを確認し、変更を確認して保存。許可した写真、活動データ、現在地も利用できます。アラームとタイマーには iOS 26 が必要です。"
      fontawesome_icon_name: calendar-check
    - title: "アプリとショートカットを接続"
      description: "Appツールを有効にするか Apple ショートカットのファイルを読み込み、AI Chat から呼び出せます。書き込み前に確認し、対応するショートカットはテキスト結果を返せます。"
      fontawesome_icon_name: external-link-alt
    - title: "ファイルと画像を作成"
      description: "AI Chat で添付を処理し、文書やグラフを作成、画像を生成・編集できます。できた成果物をプレビューして共有できます。"
      fontawesome_icon_name: images
    - title: "いつもの手順を再利用"
      description: "ZIP や GitHub から Skills を読み込み、端末上の Linux Sandbox でスクリプト、計算、ファイル処理を実行。出力の確認や作業領域の管理もできます。"
      fontawesome_icon_name: terminal
    - title: "探して、続きから再開"
      description: "検索、タグ、ピン留め、アーカイブでノートを管理し、端末内の会話履歴を再開。ノートとトピックは iCloud、チャットの作業領域は各端末に保存します。"
      fontawesome_icon_name: search
  workflow:
    eyebrow: "使い方"
    title: "素早い取り込みから、すぐ使える結果へ。"
    cards:
      - step: "01"
        title: "大切な内容を取り込む"
        description: "ノート、読み込み、録音、チャット、iOS 共有シートから開始。ウィジェットやクイック記録のショートカットで入力画面も開けます。"
      - step: "02"
        title: "素材を理解する"
        description: "AI の結果と元の資料を確認するか、録音しながら要点を整理します。"
      - step: "03"
        title: "トピックを育てる"
        description: "関連ノートを追加し、方向性を設定。Wiki を作るか、ブリーフ、タスクリスト、文書を保存します。"
      - step: "04"
        title: "次の行動につなげる"
        description: "文字や音声で会話を続け、ファイルを作成し、予定・リマインダー・アプリの操作を確認して実行します。"
  outcomes:
    eyebrow: アプリが生み出すもの
    title: 生のノートより、ずっと使いやすい結果。
    result_types:
      eyebrow: 受信トレイの結果タイプ
      title: よくあるノートの形に合わせた構造化出力。
      items:
        - label: アイデア
          description: 考えを整理し、要点を抜き出し、次に掘り下げる方向を提案します。
        - label: 会議
          description: 議論内容、決定事項、アクション項目、未解決の質問を要約します。
        - label: リマインダー
          description: 走り書きのメモを、ただのテキストのまま残さず実行可能な下書きに変えます。
        - label: 要約
          description: Web ページ、チャット、参考資料を主要ポイントに圧縮します。
        - label: 知識
          description: ハイライトや調査メモを、あとで再利用しやすい形に整えます。
    next_steps:
      eyebrow: 次にできること
      title: 流れを止めずに、理解から実行へ進めます。
      items:
        - "ノートやトピックの文脈を使って文字・音声で会話する。"
        - "予定、リマインダー、有効なアプリ操作を確認して実行する。"
        - "文書、グラフ、画像、共有用のノートカードを作る。"
        - "端末の会話履歴を再開し、添付や生成ファイルを再利用する。"
        - "返答だけでは完結しない作業には Skills と Sandbox を使う。"
  trust:
    cards:
      - eyebrow: "既定でプライベート"
        title: "自分のノートを、自分の iCloud に。"
        description: "ノートとトピックは個人の iCloud を使用します。会話履歴、生成ファイル、Skills、Appツール設定は各端末に保存します。"
      - eyebrow: "継続する仕事のための設計"
        title: "AI に渡す情報を選べます。"
        description: "関連内容は設定した AI サービスへ送信されます。端末データへのアクセスは任意で、予定、リマインダー、連携アプリへの書き込みは事前に確認できます。"
  faq:
    eyebrow: "FAQ"
    title: "ダウンロード前によくある質問へ短く回答します。"
    description: "使い方ガイドと活用例を読む"
    items:
      - question: "どのプラットフォームに対応していますか？"
        answer: "iPhone、iPad、ネイティブ Mac 版があります。端末データツールと録音中のリアルタイム整理は iOS の機能です。詳しくはガイドをご覧ください。"
      - question: "端末間で何が同期されますか？"
        answer: "ノートとトピックは個人の iCloud で同期します。会話履歴、AI 作業領域のファイル、Skills、Appツール設定は端末ごとに保存します。"
      - question: "録音とリアルタイム音声会話の違いは？"
        answer: "録音は自分の音声をノートに残す機能で、API キー利用時は録音中の整理も可能です。音声会話は AI との双方向のやりとりで、既存チャットを引き継げます。"
      - question: "AI 機能には何が必要ですか？"
        answer: "iPhone・iPad では AnyNotes Pro と API キーまたは Codex ログインが必要です。Mac 版は AnyNotes Pro 不要です。AI サービスの利用分は別途扱われ、利用できる機能はアカウントによって異なります。"
  cta:
    eyebrow: まだ整理されていない段階から始める
    title: まず集めて、すばやく整理し、流れを止めずに進める。
    description: アイデア、会議、リンク、スクリーンショット、音声メモがまだ半端な状態でも、あとでより明確な結果が必要になると分かっているなら、AnyNotes がまず受け止めてくれます。
    app_store: App Store でダウンロード
    testflight: TestFlight ベータを試す
    support: 質問がありますか？ Support を見る
