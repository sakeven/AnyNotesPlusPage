guide:
  screens:
    capture:
      - file: "inbox-home"
        title: "受信トレイ"
        caption: "AI の結果とタグを確認し、下部からチャット、読み込み、録音、ノート作成へ進めます。"
      - file: "note-detail"
        title: "ノートの詳細"
        caption: "整理された結果を読み、元の文章、画像、Webページを確認できます。"
    topics:
      - file: "topic-home"
        title: "トピック一覧"
        caption: "進行中のトピックと、現在の見立て、最近の変化、次の一手を確認します。"
      - file: "topic-detail"
        title: "現在の理解を確認"
        caption: "関連ノートをまとめ、現在の見立てを確認しながら資料を追加します。"
      - file: "topic-wiki"
        title: "Topic Wiki を育てる"
        caption: "知識ブロックを展開し、出典をたどりながら継続して知識を蓄積します。"
      - file: "topic-outcomes"
        title: "トピックから成果へ"
        caption: "ブリーフ、タスクリスト、文書を選び、保存・編集できる成果にまとめます。"
    recording:
      - file: "recording"
        title: "録音しながら整理"
        caption: "要点、未解決の問い、次のステップを確認。下部で一時停止、完了、ヒントの依頼ができます。"
      - file: "recording-transcript"
        title: "原文を確認"
        caption: "文字起こしに切り替え、発言を AI の整理結果と分けて確認します。"
    chat:
      - file: "chat"
        title: "文脈を引き継ぐ対話"
        caption: "資料について具体的に質問し、追加で相談。必要な会話はノートとして保存できます。"
    voice:
      - file: "voice"
        title: "字幕付きの音声会話"
        caption: "返答の字幕を読みながら、下部でミュート、一時停止、終了、字幕表示を操作します。"
    device:
      - file: "data-usage"
        title: "データごとに許可"
        caption: "AI と今日の進捗が利用する情報源を個別に管理。"
      - file: "today"
        title: "今日の進捗"
        caption: "トピックの変化や再開できる項目を確認。トピックの内容は専用の章で紹介します。"
    apps:
      - file: "app-tools"
        title: "アプリツールの入口"
        caption: "ツールや .shortcut ファイルを読み込み、設定と有効化の状態を確認します。"
      - file: "shortcut"
        title: "ショートカットを確認"
        caption: "Apple ショートカット内の名前と一致させてから分析。読み込みだけでは実行されません。"
    outputs:
      - file: "files"
        title: "成果ファイルのプレビュー"
        caption: "生成したファイルを開き、内容を確認してから共有・書き出しできます。"
      - file: "skills"
        title: "Skills を管理"
        caption: "端末内のスキルを確認し、ZIP や GitHub から手順を読み込みます。"
    storage:
      - file: "sandbox"
        title: "端末内の作業領域"
        caption: "Sandbox とファイル数を確認し、必要なら作業領域の一覧を開いて整理します。"
    practice-meetings:
