        title: "決定事項と残りの作業"
        caption: "今回は検索改善を公開。テストは担当が決まり、ヘルプは分担待ちです。"
      - file: "practice-meeting-transcript"
        title: "発言を原文で確認"
        caption: "公開範囲、テストの日程、担当者を文字起こしで確認します。"
    practice-research:
