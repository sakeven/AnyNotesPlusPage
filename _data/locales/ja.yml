  app_eyebrow: "AIノート · リアルタイム音声 · トピック"
  app_headline: "AnyNotes+ AIワークスペース"
  app_slogan: "思いつきを残し、次へつなげる。"
  guide_link: "使い方ガイドと活用例を読む"
