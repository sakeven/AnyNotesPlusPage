guide:
  screens:
    capture:
      - file: "inbox-home"
        title: "收件匣"
        caption: "查看 AI 結果與標籤，從底部進入對話、匯入、錄音或新增筆記。"
      - file: "note-detail"
        title: "筆記詳情"
        caption: "先讀整理結果，再回看原始文字、圖片或網頁來源。"
    topics:
      - file: "topic-home"
        title: "主題總覽"
        caption: "檢視正在推進的主題，以及各主題的目前判斷、最近變化和下一步。"
      - file: "topic-detail"
        title: "主題的目前進展"
        caption: "把相關筆記集中至同一主題，查看目前判斷，並繼續補充資料。"
      - file: "topic-wiki"
        title: "累積 Topic Wiki"
        caption: "展開知識區塊查看穩定資訊與來源入口，讓資料形成可持續更新的知識。"
      - file: "topic-outcomes"
        title: "從主題形成成果"
        caption: "選擇簡報、工作清單或正式文稿，將討論轉成可儲存與編輯的成果。"
    recording:
      - file: "recording"
        title: "邊錄邊整理"
        caption: "檢視正在形成的要點、開放問題和下一步；底部可暫停、完成或請求啟發。"
      - file: "recording-transcript"
        title: "對照轉錄原文"
        caption: "切換到「轉寫內容」檢視發言，與 AI 整理的結論分開核對。"
    chat:
      - file: "chat"
        title: "帶著脈絡討論"
        caption: "把已有資料變成具體問題，繼續追問，再將需要保留的討論儲存為筆記。"
    voice:
      - file: "voice"
        title: "即時語音與字幕"
        caption: "AI 回覆時顯示字幕，底部提供靜音、暫停、結束和字幕開關。"
    device:
      - file: "data-usage"
        title: "逐項授權資料"
        caption: "在「資料使用」分別管理 AI 和今日推進可使用的來源。"
      - file: "today"
        title: "今日推進"
        caption: "集中查看主題變化與可繼續處理的事項。主題本身的內容請見主題章節。"
    apps:
      - file: "app-tools"
        title: "應用工具入口"
        caption: "從這裡匯入應用工具或 .shortcut 檔案；安裝後仍需核對設定與啟用狀態。"
      - file: "shortcut"
        title: "先核對捷徑"
        caption: "確認名稱與系統「捷徑」一致，再發起分析；匯入本身不會執行捷徑。"
    outputs:
      - file: "files"
        title: "預覽產生的檔案"
        caption: "開啟產生的檔案，檢查內容後分享或匯出至其他 App。"
      - file: "skills"
        title: "管理 Skills"
        caption: "檢視本機技能，或從 ZIP、GitHub 匯入可重用的任務說明。"
    storage:
      - file: "sandbox"
        title: "管理本機工作區"
        caption: "檢視 Sandbox 與檔案統計，需要時展開工作區清單進行清理。"
    practice-meetings:
      - file: "practice-meeting-live"
        title: "討論中的決定與待辦"
        caption: "本次先發布搜尋改進；測試已有負責人，說明文件還需要分工。"
      - file: "practice-meeting-transcript"
        title: "對照轉寫原文"
        caption: "回到原話核對發布範圍、測試時間與負責人。"
    practice-research:
      - file: "practice-research-wiki"
        title: "知識庫選型的 Wiki"
        caption: "依團隊需求整理選型標準，保留試用時需要驗證的問題。"
      - file: "practice-research-chat"
        title: "繼續比較候選方案"
        caption: "根據資料討論兩個候選方案，指出還缺乏依據的判斷。"
    practice-planning:
      - file: "topic-detail"
        title: "旅行與日常規劃"
        caption: "先寫清楚要解決的問題與判斷標準"
      - file: "files"
        title: "可分享的行程"
        caption: "預覽行程檔案，核對日期、地點和待預訂事項。"
    practice-delivery:
      - file: "practice-delivery-outcome"
        title: "儲存專案簡報草稿"
        caption: "將搜尋改進的討論儲存為簡報，之後可編輯或標記完成。"
      - file: "practice-delivery-file"
        title: "檢查準備分享的檔案"
        caption: "開啟搜尋改進簡報，核對發布範圍、測試安排與未定事項。"
