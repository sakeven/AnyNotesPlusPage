      - title: 收件匣
        description: 展示今天的筆記、AI 結果卡片、標籤，以及四種主要擷取入口。
        alt: AnyNotes 收件匣截圖
        image: /assets/screenshot/zh-Hant/inbox-home.png
      - title: 主題首頁
        description: 在主題首頁集中呈現主題的目前結論、最近變化與下一步行動。
        alt: AnyNotes 主題首頁截圖
        image: /assets/screenshot/zh-Hant/topic-home.png
