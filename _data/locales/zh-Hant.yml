        alt: "AnyNotes 主題成果截圖"
        image: /assets/screenshot/zh-Hant/topic-outcomes.png
  features_intro:
    eyebrow: 更貼近真實記錄習慣
    title: "從一個念頭，到可以使用的成果。"
    description: "先收集素材，再用 AI 釐清思路，沿著同一則筆記、主題或對話繼續推進。"
  features:
    - title: "隨手收集，自動整理"
      description: "寫筆記、錄音，匯入照片、PDF 或文字檔案，也能從分享選單儲存網頁。AI 會產生標題、摘要、結果卡片和下一步建議。"
      fontawesome_icon_name: inbox
    - title: "邊說邊整理"
      description: "在 iOS 錄音時持續整理重點、待解問題和下一步。建議的操作經你檢視確認後才會執行；即時整理需要 API Key。"
      fontawesome_icon_name: microphone
    - title: "用即時語音繼續討論"
      description: "從新對話或既有聊天進入語音，帶著上下文繼續交流、查看字幕，並讓 AI 使用目前聊天中可用的工具。"
      fontawesome_icon_name: comments
    - title: "讓主題累積成知識"
      description: "把相關筆記放在一起，設定演進方向，建立附有來源筆記的 Topic Wiki，再把簡報、任務清單或正式文稿儲存為主題成果。"
      fontawesome_icon_name: project-diagram
    - title: "結合裝置安排下一步"
      description: "在 iOS 查詢行程與提醒事項，檢視後再建立或修改。授權後還能使用照片、健康與運動資料及目前位置；鬧鐘和倒數計時需要 iOS 26。"
      fontawesome_icon_name: calendar-check
    - title: "連接 App 與捷徑"
      description: "啟用 App 工具，或匯入 Apple 捷徑檔案供 AI 對話呼叫。寫入操作先檢視確認，支援的捷徑可將文字結果帶回對話。"
      fontawesome_icon_name: external-link-alt
    - title: "產出檔案與圖片"
      description: "在 AI 對話中處理附件、製作文書和圖表、產生或編輯圖片。查看實際產物，再預覽或分享需要的檔案。"
      fontawesome_icon_name: images
    - title: "重用熟悉的工作流程"
      description: "從 ZIP 或 GitHub 匯入 Skills，使用裝置端 Linux 沙箱執行腳本、計算和檔案處理，並查看指令輸出、管理本機工作區。"
      fontawesome_icon_name: terminal
    - title: "找得到，也接得上"
      description: "搜尋、標籤篩選、釘選與封存讓筆記保持有序，本機聊天記錄讓討論能夠繼續。筆記與主題透過 iCloud 同步，聊天工作區保存在裝置上。"
      fontawesome_icon_name: search
  workflow:
    eyebrow: "使用流程"
    title: "從快速記錄，到可以直接行動的結果。"
    cards:
      - step: "01"
        title: "收集重要內容"
        description: "從筆記、匯入、錄音、對話或 iOS 分享選單開始，也能用小工具和快速記錄捷徑開啟文字編輯器。"
      - step: "02"
        title: "釐清素材"
        description: "查看 AI 結果並回看原始來源，或在錄音時邊說邊整理重點。"
      - step: "03"
        title: "持續發展主題"
        description: "加入相關筆記，明確設定演進方向，建立 Wiki，或儲存簡報、任務清單和文稿。"
      - step: "04"
        title: "推進下一步"
        description: "繼續文字或語音對話，產生檔案，或確認行事曆、提醒事項和已安裝 App 中的操作。"
  outcomes:
    eyebrow: App 會產出什麼
    title: 比原始筆記更容易直接使用的結果。
    result_types:
      eyebrow: 收件匣結果類型
      title: 針對常見筆記情境的結構化輸出。
      items:
        - label: 想法
          description: 幫你釐清一個念頭，提煉重點，並建議接下來可以探索什麼。
        - label: 會議
          description: 總結討論內容、結論、行動項目與尚未解決的問題。
        - label: 提醒
          description: 把隨手記下的文字變成可執行的任務草稿，而不是停留在一句話。
        - label: 摘要
          description: 將網頁、聊天與參考資料壓縮成主要資訊。
        - label: 知識
          description: 把摘錄與研究筆記整理成之後更容易重用的內容。
    next_steps:
      eyebrow: 下一步可以做什麼
      title: 從理解直接走向執行，不必跳出目前流程。
      items:
        - "帶著筆記或主題上下文，繼續文字與即時語音對話。"
        - "先檢視，再執行行事曆、提醒事項和已啟用的 App 操作。"
        - "製作文書、圖表、產生圖片或可分享的筆記結果卡。"
        - "繼續本機歷史對話，重用其中的附件和產生的檔案。"
        - "需要執行多步驟任務時，使用 Skills 和沙箱工作區。"
  trust:
    cards:
      - eyebrow: "預設更私密"
        title: "你的筆記，你的 iCloud。"
        description: "筆記與主題使用你的個人 iCloud 帳號；聊天記錄、產生的檔案、Skills 和 App 工具設定保存在各自裝置上。"
      - eyebrow: "為持續推進而設計"
        title: "由你選擇 AI 可以使用什麼。"
        description: "相關內容會傳送給你設定的 AI 服務。裝置資料按需授權，寫入行事曆、提醒事項或連接的 App 前會顯示內容供你核對。"
  faq:
    eyebrow: "常見問題"
    title: "下載前先看幾個簡短答案。"
    description: "閱讀使用手冊與情境範例"
    items:
      - question: "AnyNotes+ 支援哪些平台？"
        answer: "提供 iPhone、iPad 和原生 Mac 使用體驗。裝置資料工具與錄音即時整理屬於 iOS 功能，差異可查看使用手冊。"
      - question: "哪些內容會跨裝置同步？"
        answer: "筆記與主題透過個人 iCloud 同步；聊天記錄、AI 工作區檔案、Skills 和 App 工具設定保存在各自裝置上。"
      - question: "錄音和即時語音對話有什麼差別？"
        answer: "錄音用於把你的聲音儲存成筆記，API Key 模式還能即時整理；即時語音則是與 AI 雙向交流，可以接著既有聊天繼續。"
      - question: "使用 AI 功能需要什麼？"
        answer: "iPhone 和 iPad 需要 AnyNotes Pro，並設定 API Key 或登入 Codex；Mac 版無需 AnyNotes Pro。AI 服務用量另計，功能可用性取決於你的帳號。"
  cta:
    eyebrow: 先從還很混亂的版本開始
    title: 先收集，快釐清，再繼續推進。
    description: 當一個想法、會議、連結、截圖或語音備忘還只是半成品，但你已經知道之後需要更清楚的結果時，就可以直接用 AnyNotes 先把它接住。
    app_store: 在 App Store 下載
    testflight: 試用 TestFlight 測試版
    support: 有問題？查看支援頁面
