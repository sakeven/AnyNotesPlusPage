guide:
  screens:
    capture:
      - file: "inbox-home"
        title: "收件箱"
        caption: "查看 AI 结果与标签，从底部进入对话、导入、录音或新建笔记。"
      - file: "note-detail"
        title: "笔记详情"
        caption: "先读整理结果，再回看原始文字、图片或网页来源。"
    topics:
      - file: "topic-home"
        title: "主题总览"
        caption: "查看正在推进的主题，以及每个主题的当前判断、最近变化和下一步。"
      - file: "topic-detail"
        title: "主题的当前进展"
        caption: "把相关笔记集中到同一主题，查看当前判断，并继续补充材料。"
      - file: "topic-wiki"
        title: "积累 Topic Wiki"
        caption: "展开知识块查看稳定信息与来源入口，让零散材料形成可以持续更新的知识。"
      - file: "topic-outcomes"
        title: "从主题形成成果"
        caption: "选择简报、任务清单或正式文稿，将讨论转成可以保存与继续编辑的成果。"
    recording:
      - file: "recording"
        title: "边录边整理"
        caption: "查看正在形成的要点、开放问题和下一步；底部可以暂停、完成或请求启发。"
      - file: "recording-transcript"
        title: "对照转录原文"
        caption: "切换到「转写稿」查看讲话内容，与 AI 整理的结论分开核对。"
    chat:
      - file: "chat"
        title: "带着上下文讨论"
        caption: "把已有材料变成具体问题，继续追问，再把需要保留的讨论保存为笔记。"
    voice:
      - file: "voice"
        title: "实时语音与字幕"
        caption: "AI 回复时显示字幕，底部提供静音、暂停、结束和字幕开关。"
    device:
      - file: "data-usage"
        title: "逐项授权数据"
        caption: "在「数据使用」分别管理 AI 和今日推进可以使用哪些来源。"
      - file: "today"
        title: "今日推进"
        caption: "集中查看主题变化与可继续处理的事项。它是日常入口，主题本身的内容见主题章节。"
    apps:
      - file: "app-tools"
        title: "应用工具入口"
        caption: "从这里导入应用工具或 .shortcut 文件；安装后还需核对配置与启用状态。"
      - file: "shortcut"
        title: "先核对快捷指令"
        caption: "确认名称与系统「快捷指令」一致，再发起分析；导入本身不会运行指令。"
    outputs:
      - file: "files"
        title: "预览生成文件"
        caption: "打开生成的文件，检查内容后分享或导出到其他应用。"
      - file: "skills"
        title: "管理 Skills"
        caption: "查看本机技能，或从 ZIP、GitHub 导入可复用的任务说明。"
    storage:
      - file: "sandbox"
        title: "管理本机工作区"
        caption: "查看 Sandbox 与文件统计，需要时展开工作区列表进行清理。"
    practice-meetings:
      - file: "practice-meeting-live"
        title: "讨论中的决定与待办"
        caption: "本次先发布搜索改进；测试已有负责人，帮助文档还需要分工。"
      - file: "practice-meeting-transcript"
        title: "对照转写原文"
        caption: "回到原话核对发布范围、测试时间和谁来负责。"
    practice-research:
      - file: "practice-research-wiki"
        title: "知识库选型的 Wiki"
        caption: "按团队需求整理选型标准，保留试用时需要验证的问题。"
      - file: "practice-research-chat"
        title: "继续比较候选方案"
        caption: "从已有资料讨论两个候选方案，明确哪些判断还缺证据。"
    practice-planning:
      - file: "topic-detail"
        title: "旅行与日常规划"
        caption: "先写清楚要解决的问题与判断标准"
      - file: "files"
        title: "可分享的行程"
        caption: "预览行程文件，核对日期、地点和待预订事项。"
    practice-delivery:
      - file: "practice-delivery-outcome"
        title: "保存项目简报草稿"
        caption: "将搜索改进的讨论保存为简报，后续仍可编辑或标记完成。"
      - file: "practice-delivery-file"
        title: "检查准备分享的文件"
        caption: "打开搜索改进简报，核对发布范围、测试安排和未定事项。"
