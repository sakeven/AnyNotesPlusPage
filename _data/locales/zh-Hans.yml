    eyebrow: 产品界面
    title: "看看笔记与主题如何衔接。"
    description: "看看收集的材料如何变成可以使用的成果。"
    cards:
      - title: 收件箱
        description: 展示今天的笔记、AI 结果卡片、标签，以及四种主要捕捉入口。
        alt: AnyNotes 收件箱截图
        image: /assets/screenshot/zh-Hans/inbox-home.png
      - title: 主题首页
