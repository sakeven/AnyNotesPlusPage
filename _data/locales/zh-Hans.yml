        alt: "AnyNotes 主题成果截图"
        image: /assets/screenshot/zh-Hans/topic-outcomes.png
  features_intro:
    eyebrow: 更贴近真实记录习惯
    title: "从一个念头，到可以使用的成果。"
    description: "先收集材料，再用 AI 理清思路，沿着同一条笔记、主题或对话继续推进。"
  features:
    - title: "随手收集，自动整理"
      description: "写笔记、录音，导入照片、PDF 或文本文件，也能从分享菜单保存网页。AI 会生成标题、摘要、结果卡片和下一步建议。"
      fontawesome_icon_name: inbox
    - title: "边说边整理"
      description: "在 iOS 录音时持续整理要点、待解决问题和下一步。建议的操作经你查看确认后才会执行；实时整理需要 API Key。"
      fontawesome_icon_name: microphone
    - title: "用实时语音继续讨论"
      description: "从新对话或已有聊天进入语音，带着上下文继续交流、查看字幕，并让 AI 使用当前聊天中可用的工具。"
      fontawesome_icon_name: comments
    - title: "让主题沉淀为知识"
      description: "把相关笔记放在一起，设定演进方向，建立带来源笔记的 Topic Wiki，再把简报、任务清单或正式文稿保存为主题成果。"
      fontawesome_icon_name: project-diagram
    - title: "结合设备安排下一步"
      description: "在 iOS 查询日程和提醒，审阅后再创建或修改。授权后还能使用照片、健康与运动数据及当前位置；闹钟和倒计时需要 iOS 26。"
      fontawesome_icon_name: calendar-check
    - title: "连接应用与快捷指令"
      description: "启用应用工具，或导入 Apple 快捷指令文件供 AI 对话调用。写操作先审阅确认，支持的快捷指令可把文字结果带回对话。"
      fontawesome_icon_name: external-link-alt
    - title: "产出文件与图片"
      description: "在 AI 对话中处理附件、制作文档和图表、生成或编辑图片。查看实际产物，再预览或分享需要的文件。"
      fontawesome_icon_name: images
    - title: "复用熟悉的工作流程"
      description: "从 ZIP 或 GitHub 导入 Skills，借助设备端 Linux 沙箱执行脚本、计算和文件处理，并查看命令输出、管理本地工作区。"
      fontawesome_icon_name: terminal
    - title: "找得到，也接得上"
      description: "搜索、标签筛选、置顶和归档让笔记保持有序，本机聊天历史让讨论能够继续。笔记与主题通过 iCloud 同步，聊天工作区保存在设备上。"
      fontawesome_icon_name: search
  workflow:
    eyebrow: "工作流程"
    title: "从快速记录，到可以直接行动的结果。"
    cards:
      - step: "01"
        title: "收集重要内容"
        description: "从笔记、导入、录音、对话或 iOS 分享菜单开始，也能用小组件和快速记录快捷入口打开文字编辑器。"
      - step: "02"
        title: "理清材料"
        description: "查看 AI 结果并回看原始来源，或在录音时边说边整理要点。"
      - step: "03"
        title: "持续发展主题"
        description: "加入相关笔记，明确演进方向，建立 Wiki，或保存简报、任务清单和文稿。"
      - step: "04"
        title: "推进下一步"
        description: "继续文字或语音对话，生成文件，或确认日历、提醒事项和已安装应用中的操作。"
  outcomes:
    eyebrow: 应用会产出什么
    title: 比原始笔记更容易直接使用的结果。
    result_types:
      eyebrow: 收件箱结果类型
      title: 面向常见笔记场景的结构化输出。
      items:
        - label: 想法
          description: 帮你澄清一个念头，提炼关键点，并建议接下来可以继续探索什么。
        - label: 会议
          description: 总结讨论内容、结论、行动项以及尚未解决的问题。
        - label: 提醒
          description: 把随手写下的文字变成可执行的任务草稿，而不是停留在一句话。
        - label: 总结
          description: 将网页、聊天和参考资料压缩成主要信息。
        - label: 知识
          description: 把摘录和研究笔记整理成以后更容易复用的内容。
    next_steps:
      eyebrow: 下一步可以做什么
      title: 从理解直接走向执行，不必跳出当前流程。
      items:
        - "带着笔记或主题上下文，继续文字与实时语音对话。"
        - "先审阅，再执行日历、提醒事项和已启用的应用操作。"
        - "制作文档、图表、生成图片或可分享的笔记结果卡。"
        - "继续本机历史对话，复用其中的附件和生成文件。"
        - "需要执行多步任务时，使用 Skills 和沙箱工作区。"
  trust:
    cards:
      - eyebrow: "默认更私密"
        title: "你的笔记，你的 iCloud。"
        description: "笔记与主题使用你的个人 iCloud 账户；聊天记录、生成文件、Skills 和应用工具配置保存在各自设备上。"
      - eyebrow: "为持续推进而设计"
        title: "由你选择 AI 可以使用什么。"
        description: "相关内容会发送给你配置的 AI 服务。设备数据按需授权，写入日历、提醒事项或连接的应用前会展示内容供你核对。"
  faq:
    eyebrow: "常见问题"
    title: "下载前先看几个简短答案。"
    description: "阅读使用手册与场景示例"
    items:
      - question: "AnyNotes+ 支持哪些平台？"
        answer: "提供 iPhone、iPad 和原生 Mac 使用体验。设备数据工具与录音实时整理属于 iOS 功能，具体差异可查看使用手册。"
      - question: "哪些内容会跨设备同步？"
        answer: "笔记与主题通过个人 iCloud 同步；聊天历史、AI 工作区文件、Skills 和应用工具配置保存在各自设备上。"
      - question: "录音和实时语音对话有什么区别？"
        answer: "录音用于把你的声音保存成笔记，API Key 模式还能实时整理；实时语音则是与 AI 双向交流，可以接着已有聊天继续。"
      - question: "使用 AI 功能需要什么？"
        answer: "iPhone 和 iPad 需要 AnyNotes Pro，并配置 API Key 或登录 Codex；Mac 版无需 AnyNotes Pro。AI 服务用量单独计算，功能可用性取决于你的账号。"
  cta:
    eyebrow: 先从还很混乱的版本开始
    title: 先收集，快澄清，再继续推进。
    description: 当一个想法、会议、链接、截图或语音备忘还只是半成品，但你已经知道之后需要更清晰结果时，就可以直接用 AnyNotes 先把它接住。
    app_store: 在 App Store 下载
    testflight: 试用 TestFlight 测试版
    support: 有问题？查看支持页面
