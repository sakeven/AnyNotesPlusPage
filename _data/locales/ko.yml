          description: 생각을 정리하고 핵심 포인트를 뽑아 다음에 탐색할 방향을 제안합니다.
        - label: 회의
          description: 논의 내용, 결정 사항, 액션 아이템, 미해결 질문을 요약합니다.
        - label: 미리 알림
          description: 짧은 메모를 그냥 텍스트로 두지 않고 바로 실행 가능한 작업 초안으로 바꿉니다.
        - label: 요약
          description: 웹페이지, 채팅, 참고 자료를 핵심 내용으로 압축합니다.
        - label: 지식
          description: 하이라이트와 리서치 노트를 나중에 다시 쓰기 쉬운 형태로 정리합니다.
    next_steps:
      eyebrow: 다음에 할 수 있는 일
      title: 흐름을 벗어나지 않고 이해에서 실행으로 넘어가세요.
      items:
        - "노트나 주제의 맥락을 활용해 텍스트와 실시간 음성으로 대화하세요."
        - "일정, 미리 알림, 활성화한 앱 작업을 검토한 뒤 실행하세요."
        - "문서, 차트, 이미지, 공유용 노트 카드를 만드세요."
        - "로컬 대화를 다시 열어 첨부 파일과 생성한 파일을 재사용하세요."
        - "답변만으로 끝나지 않는 작업에는 Skills와 Sandbox를 사용하세요."
  trust:
    cards:
      - eyebrow: "기본적으로 더 비공개"
        title: "내 노트를 내 iCloud에."
        description: "노트와 주제는 개인 iCloud를 사용합니다. 채팅 기록, 생성한 파일, Skills와 앱 도구 설정은 각 기기에 저장됩니다."
      - eyebrow: "계속 이어지는 작업을 위한 설계"
        title: "AI가 사용할 정보를 선택하세요."
        description: "관련 내용은 설정한 AI 서비스로 전송됩니다. 기기 데이터 접근은 선택 사항이며 일정, 미리 알림, 연결한 앱에 쓰기 전에 내용을 검토할 수 있습니다."
  faq:
    eyebrow: "FAQ"
    title: "다운로드 전에 자주 묻는 질문을 먼저 확인하세요."
    description: "사용 설명서와 활용 사례 보기"
    items:
      - question: "어떤 플랫폼을 지원하나요?"
        answer: "iPhone, iPad와 네이티브 Mac 환경을 제공합니다. 기기 데이터 도구와 녹음 중 실시간 정리는 iOS 기능입니다. 자세한 차이는 사용 설명서에서 확인하세요."
      - question: "기기 간에 무엇이 동기화되나요?"
        answer: "노트와 주제는 개인 iCloud로 동기화됩니다. 채팅 기록, AI 작업 공간 파일, Skills와 앱 도구 설정은 각 기기에 저장됩니다."
      - question: "녹음과 실시간 음성 대화는 어떻게 다른가요?"
        answer: "녹음은 내 음성을 노트로 저장하며 API 키 모드에서는 실시간 정리도 가능합니다. 실시간 음성은 AI와 양방향으로 대화하며 기존 채팅을 이어 갈 수 있습니다."
      - question: "AI 기능에는 무엇이 필요한가요?"
        answer: "iPhone과 iPad에는 AnyNotes Pro와 API 키 또는 Codex 로그인이 필요합니다. Mac 앱은 AnyNotes Pro가 필요하지 않습니다. AI 서비스 사용량은 별도로 적용되며 기능은 계정에 따라 달라집니다."
  cta:
