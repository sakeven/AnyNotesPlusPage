  features:
    - title: "수집하고 정리하기"
      description: "노트와 녹음을 남기고 사진, PDF, 텍스트 파일이나 공유한 웹페이지를 가져오세요. AI가 제목, 요약, 결과 카드와 다음 단계를 정리합니다."
      fontawesome_icon_name: inbox
    - title: "말하면서 생각 정리하기"
      description: "iOS에서 녹음하는 동안 핵심 내용, 열린 질문과 다음 단계를 정리합니다. 제안된 작업은 검토 후 실행하며, 실시간 정리에는 API 키가 필요합니다."
      fontawesome_icon_name: microphone
    - title: "실시간 음성으로 이어 가기"
      description: "새 대화나 기존 채팅에서 음성 대화를 시작하세요. 맥락을 유지하고 자막을 보며 현재 채팅에서 사용할 수 있는 도구로 작업을 요청할 수 있습니다."
      fontawesome_icon_name: comments
    - title: "주제를 지식으로 발전시키기"
      description: "관련 노트를 모아 방향을 설정하고 출처 노트가 연결된 Topic Wiki를 만드세요. 브리프, 작업 목록, 문서를 주제 결과물로 저장할 수 있습니다."
      fontawesome_icon_name: project-diagram
    - title: "기기 정보로 다음 계획 세우기"
      description: "iOS에서 일정과 미리 알림을 조회하고 변경 내용을 검토한 뒤 저장하세요. 허용한 사진, 활동 데이터와 현재 위치도 사용할 수 있습니다. 알람과 타이머에는 iOS 26이 필요합니다."
      fontawesome_icon_name: calendar-check
    - title: "앱과 단축어 연결하기"
      description: "앱 도구를 활성화하거나 Apple 단축어 파일을 가져와 AI Chat에서 호출하세요. 쓰기 작업은 먼저 확인하며, 지원하는 단축어는 텍스트 결과를 대화로 돌려줍니다."
      fontawesome_icon_name: external-link-alt
    - title: "파일과 이미지 만들기"
      description: "AI Chat에서 첨부 파일을 처리하고 문서와 차트를 만들거나 이미지를 생성·편집하세요. 실제 결과물을 미리 보고 필요한 파일을 공유할 수 있습니다."
      fontawesome_icon_name: images
    - title: "익숙한 작업 방식 재사용하기"
      description: "ZIP이나 GitHub에서 Skills를 가져오고 기기의 Linux Sandbox로 스크립트, 계산, 파일 처리를 실행하세요. 명령 출력을 확인하고 로컬 작업 공간을 관리할 수 있습니다."
      fontawesome_icon_name: terminal
    - title: "찾고, 이어서 작업하기"
      description: "검색, 태그, 고정, 보관으로 노트를 관리하고 로컬 채팅 기록을 다시 여세요. 노트와 주제는 iCloud로 동기화되며 채팅 작업 공간은 각 기기에 저장됩니다."
      fontawesome_icon_name: search
  workflow:
    eyebrow: "사용 방식"
    title: "빠른 캡처에서 바로 실행 가능한 결과까지."
    cards:
      - step: "01"
        title: "중요한 내용 수집하기"
        description: "노트, 가져오기, 녹음, 채팅, iOS 공유 시트에서 시작하세요. 위젯이나 빠른 기록 단축어로 텍스트 편집기를 열 수도 있습니다."
      - step: "02"
        title: "자료 이해하기"
        description: "AI 결과와 원본을 확인하거나 녹음하면서 핵심 내용을 정리하세요."
      - step: "03"
        title: "주제 발전시키기"
        description: "관련 노트를 추가하고 방향을 설정하세요. Wiki를 만들거나 브리프, 작업 목록, 문서를 저장하세요."
      - step: "04"
        title: "다음 단계 실행하기"
        description: "텍스트나 음성으로 대화하고 파일을 만들거나 일정, 미리 알림, 설치된 앱의 작업을 확인하세요."
  outcomes:
    eyebrow: 앱이 만들어 주는 것
    title: 원본 노트보다 바로 활용하기 쉬운 결과.
    result_types:
