home:
  page_title: "AnyNotes+ • AI Notes, Live Voice, and a Workspace for Your Ideas"
  meta_description: "Capture notes, recordings, photos, files, and links. Organize them with AI, talk through ideas in live voice, and turn Topics into knowledge and useful results."
  og_image_alt: AnyNotes+ preview showing the Inbox experience and product slogan.
  app_description: "Capture notes, recordings, photos, files, and links. Organize them with AI, talk through ideas in live voice, and turn Topics into knowledge and useful results."
  app_eyebrow: "AI notes · Live voice · Topics"
  app_headline: "AnyNotes+ AI Workspace"
  app_slogan: "Capture a thought. Keep it moving."
  guide_link: "Explore the user guide and use cases"
  hero_pills:
    - "Notes"
    - "Live recording"
    - "Voice chat"
    - "Topics"
    - "App tools"
  app_store_badge_alt: Download on the App Store
  play_store_badge_alt: Get it on Google Play
  testflight_cta: Try TestFlight
  hero_download_note: "TestFlight subscriptions are free during beta. AI service usage is separate and depends on your configured account."
  screens:
    eyebrow: Product Screens
    title: "A closer look at notes and Topics."
    description: "See how captured material becomes a useful result."
    cards:
      - title: Inbox
        description: Today's notes, AI result cards, tags, and the four primary capture actions.
        alt: AnyNotes Inbox screenshot
        image: /assets/screenshot/en/inbox-home.png
      - title: Topic Home
        description: Focused topic synthesis with current view, recent change, and next step surfaced on the Topics home screen.
        alt: AnyNotes Topic Home screenshot
        image: /assets/screenshot/en/topic-home.png
      - title: "Topic outcomes"
        description: "Turn a Topic into a brief, task list or document."
        alt: "AnyNotes Topic outcomes screenshot"
        image: /assets/screenshot/en/topic-outcomes.png
  features_intro:
    eyebrow: Why It Fits Real Capture Habits
    title: "From a quick thought to work you can use."
    description: "Collect your material, make sense of it with AI, and continue in the same note, Topic, or conversation."
  features:
    - title: "Capture and organize"
      description: "Write a note, record audio, import photos or PDF and text files, or share a web page. AI creates a title, summary, result card, and suggested next steps."
      fontawesome_icon_name: inbox
    - title: "Think while you record"
      description: "On iOS, live recording can organize key points, open questions, and next steps as you speak. Review suggested actions before running them. Live insights require an API key."
      fontawesome_icon_name: microphone
    - title: "Continue in live voice"
      description: "Talk with AI from a new conversation or an existing chat. Keep the conversation context, read captions, and ask it to work with the tools available in your chat."
      fontawesome_icon_name: comments
    - title: "Build knowledge with Topics"
      description: "Bring related notes together, define a direction, and develop a Topic Wiki with source notes. Save briefs, task lists, and longer drafts as Topic outcomes."
      fontawesome_icon_name: project-diagram
    - title: "Plan with your device"
      description: "On iOS, ask about your calendar and reminders or prepare changes to review. With permission, AI can also use photos, activity data, and your current location. Alarms and timers require iOS 26."
      fontawesome_icon_name: calendar-check
    - title: "Connect apps and Shortcuts"
      description: "Enable App Tools or import an Apple Shortcut file for use in AI Chat. Review writes before execution; supported shortcuts can return text to the conversation."
      fontawesome_icon_name: external-link-alt
    - title: "Create files and images"
      description: "Use AI Chat to work with attachments, prepare documents and charts, and generate or edit images. Preview the results and share the files you need."
      fontawesome_icon_name: images
    - title: "Reuse your workflows"
      description: "Import Skills from ZIP or GitHub and use the on-device Linux Sandbox for scripts, calculations, and file processing. Inspect command output and manage local workspaces."
      fontawesome_icon_name: terminal
    - title: "Find it and pick up later"
      description: "Search notes, filter by tags, pin or archive, and resume local chat history. Notes and Topics sync through your iCloud account; chat workspaces stay on the device."
      fontawesome_icon_name: search
  workflow:
    eyebrow: "How It Works"
    title: "From quick capture to action-ready output."
    cards:
      - step: "01"
        title: "Capture what matters"
        description: "Use Note, Import, Record, Chat, or the iOS share sheet. A widget or Quick Capture shortcut can open the text editor."
      - step: "02"
        title: "Make sense of the material"
        description: "Read the AI result, return to the source, or use live recording to collect key points while speaking."
      - step: "03"
        title: "Develop a Topic"
        description: "Add related notes, set a direction, and build a Wiki or save a brief, task list, or draft."
      - step: "04"
        title: "Take the next step"
        description: "Continue by text or voice, create files, or review an action for your calendar, reminders, or an installed app."
  outcomes:
    eyebrow: What The App Produces
    title: Results that are easier to use than raw notes.
    result_types:
      eyebrow: Inbox result types
      title: Structured outputs for common note shapes.
      items:
        - label: Idea
          description: Clarify a thought, pull out key points, and suggest what to explore next.
        - label: Meeting
          description: Summarize the discussion, decisions, action items, and unresolved questions.
        - label: Reminder
          description: Turn a quick note into a task-ready draft instead of leaving it as text.
        - label: Summary
          description: Compress web pages, chats, and reference material into the main takeaways.
        - label: Knowledge
          description: Turn highlights and research notes into something easier to reuse later.
    next_steps:
      eyebrow: What you can do next
      title: Move from understanding to execution without leaving the flow.
      items:
        - "Continue with note or Topic context in text and live voice."
        - "Review calendar, reminder, and enabled app actions before execution."
        - "Create documents, charts, generated images, or shareable note cards."
        - "Resume a local conversation and reuse its attachments and generated files."
        - "Use Skills and the Sandbox for tasks that involve more than a reply."
  trust:
    cards:
      - eyebrow: "Private by default"
        title: "Your notes, your iCloud."
        description: "Notes and Topics use your personal iCloud account. Chat history, generated files, Skills, and App Tool configuration are local to each device."
      - eyebrow: "Built for ongoing work"
        title: "Choose what AI can use."
        description: "Relevant content is sent to the AI service you configure. Device data access is optional, and writes to calendars, reminders, and connected apps are presented for review."
  faq:
    eyebrow: "FAQ"
    title: "Quick answers before you download."
    description: "Explore the user guide and use cases"
    items:
      - question: "Which platforms does AnyNotes+ support?"
        answer: "AnyNotes+ has iPhone, iPad, and native Mac experiences. Device data tools and live recording insights are iOS features; the guide explains platform differences."
      - question: "What syncs between devices?"
        answer: "Notes and Topics sync through your personal iCloud account. Chat history, AI workspace files, Skills, and App Tool configuration stay on each device."
      - question: "Is recording the same as live voice chat?"
        answer: "Recording captures your own audio as a note; API-key mode can also organize it live. Live voice is a two-way AI conversation that can continue an existing chat."
      - question: "What do I need for AI features?"
        answer: "On iPhone and iPad, AI features require AnyNotes Pro and an API key or Codex sign-in. The Mac app does not require AnyNotes Pro. AI service usage is separate; availability depends on your account."
  cta:
    eyebrow: Start With The Messy Version
    title: Collect first. Clarify fast. Keep the thread moving.
    description: Use AnyNotes when a thought, meeting, link, screenshot, or voice memo is still half-formed, but you already know you will want a clearer result later.
    app_store: Download on the App Store
    testflight: Try the TestFlight beta
    support: Questions? Visit Support
